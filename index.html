<script>
(() => {
"use strict";
/* Alguns visualizadores bloqueiam o envio de formulários; os botões e o Enter disparam o envio pela própria página. */
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest('button[type="submit"]');
  if (!b || !b.form || b.disabled) return;
  e.preventDefault();
  b.form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.isComposing) return;
  const t = e.target;
  if (!t || !t.form || t.tagName === "TEXTAREA" || t.tagName === "BUTTON") return;
  e.preventDefault();
  t.form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
});

const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString("pt-BR");
const numFmt = (ini, fim) => n => ini === 0 ? String(n).padStart(String(fim).length, "0") : String(n);
const fone = w => { const d = String(w || "").replace(/\D/g, ""); return d.length >= 10 ? `(${d.slice(0, 2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}` : d; };
const brl = v => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
let PAGE = 100;
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const API = "https://ccgnncfjqvbvxutdnmja.supabase.co/functions/v1/api/";
// Fotos que ficam junto com o site (pasta fotos/) chegam do servidor como ".../imagem/fotos/arquivo.jpg".
function semData(x) { if (Array.isArray(x)) x.forEach(semData); else if (x && typeof x === "object" && "dataSorteio" in x) x.dataSorteio = null; }
function ajustarFotos(x) {
  if (Array.isArray(x)) x.forEach(ajustarFotos);
  else if (x && typeof x === "object") for (const k in x) {
    if (k === "imagem" && typeof x[k] === "string") { const m = /\/imagem\/(fotos\/.+)$/.exec(x[k]); if (m) x[k] = m[1]; }
    else ajustarFotos(x[k]);
  }
  return x;
}
async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { "content-type": "application/json", ...(opts.headers || {}) } });
  let data = {}; try { data = await r.json(); } catch {}
  if (r.ok) { ajustarFotos(data); semData(data); }
  if (!r.ok) { const e = new Error(data.erro || "Não foi possível falar com o servidor."); e.data = data; e.status = r.status; throw e; }
  return data;
}
// Guarda no navegador quando ele deixa; se o navegador bloquear, guarda na memória da página.
const MEM = {};
const store = {
  get(k, d) {
    if (k in MEM) return MEM[k];
    try { const v = localStorage.getItem(k); if (v != null) return (MEM[k] = JSON.parse(v)); } catch {}
    return d;
  },
  set(k, v) { MEM[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let toastT;
function toast(msg) {
  let t = $("toast"); if (!t) { t = h("div", { id: "toast", class: "toast", role: "status" }); document.body.append(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3500);
}
function openModal(build) { const m = $("modal"); m.replaceChildren(); build(m); $("overlay").hidden = false; m.querySelector("input,button")?.focus(); }

$("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });
addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
function maskPhone(v) { const d = v.replace(/\D/g, "").slice(0, 11); if (d.length <= 2) return d; if (d.length <= 7) return `(${d.slice(0, 2)}) ${d.slice(2)}`; return `(${d.slice(0, 2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}`; }
function copyBtn(text, el, label = "Copiar") {
  const b = h("button", { class: "btn sm", type: "button", text: label });
  b.addEventListener("click", () => {
    const fb = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texto selecionado. Copie com o menu do celular."); };
    try { navigator.clipboard.writeText(text).then(() => { b.textContent = "Copiado!"; setTimeout(() => b.textContent = label, 1800); }, fb); } catch { fb(); }
  });
  return b;
}
const waLink = (num, msg) => { const d = String(num || "").replace(/\D/g, ""); return d ? `https://wa.me/${d.length <= 11 ? "55" + d : d}?text=${encodeURIComponent(msg || "")}` : null; };

let CFG = { nomeSite: "Rifa Sorte Online", chamada: "", maxPorPedido: 1000, minutosReserva: 30 };
let timers = [];
const clearTimers = () => { timers.forEach(t => clearInterval(t)); timers = []; };

/* ---------------- roteamento ---------------- */
async function route() {
  clearTimers(); closeModal(); $("selbar").hidden = true;
  const hash = location.hash.slice(1);
  $("navHome").hidden = !hash;
  window.scrollTo(0, 0);
  renderQuem();
  let m;
  if ((m = hash.match(/^pedido-([A-Za-z0-9]+)$/))) return viewPedido(m[1]);
  if (hash === "entrar" || (!comprador() && (hash.startsWith("rifa-") || hash === "meus"))) return viewEntrada(hash === "entrar" ? (() => { try { return sessionStorage.getItem("voltar") || ""; } catch { return ""; } })() : hash);
  if ((m = hash.match(/^rifa-(\d+)$/))) return viewRifa(+m[1]);
  if ((m = hash.match(/^pedido-([A-Za-z0-9]+)$/))) return viewPedido(m[1]);
  if (hash === "meus") return viewMeus();
  return viewHome();
}
addEventListener("hashchange", route);

/* ---------------- identificação (primeira tela) ---------------- */
const dig = v => String(v || "").replace(/\D/g, "");
function cpfValido(c) {
  c = dig(c); if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
  for (const t of [9, 10]) { let s = 0; for (let i = 0; i < t; i++) s += +c[i] * (t + 1 - i); if (((s * 10) % 11) % 10 !== +c[t]) return false; }
  return true;
}
const maskCpf = v => { const d = dig(v).slice(0, 11); return d.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})\.(\d{3})(\d)/, "$1.$2.$3").replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/, "$1.$2.$3-$4"); };
const maskCep = v => { const d = dig(v).slice(0, 8); return d.length > 5 ? d.slice(0, 5) + "-" + d.slice(5) : d; };
const cpfOculto = v => { const d = dig(v); return d.length === 11 ? `***.${d.slice(3, 6)}.${d.slice(6, 9)}-**` : ""; };
function comprador() {
  const c = store.get("comprador", null);
  return c && c.nome && dig(c.whatsapp).length >= 10 && cpfValido(c.cpf) && dig(c.cep).length === 8 && c.numeroCasa ? c : null;
}
function renderQuem() {
  const c = comprador(), el = $("quem");
  el.hidden = !c; $("navMeus").hidden = !c;
  if (!c) return;
  el.replaceChildren("Olá, ", h("b", { text: c.nome.split(/\s+/)[0] }), " · ",
    h("a", { href: "#entrar", onclick: () => { try { sessionStorage.setItem("voltar", location.hash.slice(1) === "entrar" ? "" : location.hash.slice(1)); } catch {} }, text: "trocar dados" }));
}
function viewEntrada(voltar) {
  $("navHome").hidden = true;
  const c = store.get("comprador", {}) || {};
  const err = h("div", { class: "err", role: "alert" });
  const endereco = h("p", { class: "meta", id: "eEnd", style: "margin-top:-6px", text: c.endereco || "" });
  let local = { cidade: c.cidade || "", endereco: c.endereco || "" };
  const cepIn = h("input", { id: "eCep", required: true, inputmode: "numeric", autocomplete: "postal-code", placeholder: "00000-000", value: maskCep(c.cep || "") });
  let ultimoCep = dig(c.cep);
  async function buscarCep() {
    const d = dig(cepIn.value); if (d.length !== 8 || d === ultimoCep) return;
    ultimoCep = d; endereco.textContent = "Buscando endereço…";
    try {
      const r = await fetch(`https://viacep.com.br/ws/${d}/json/`); const j = await r.json();
      if (j.erro) { local = { cidade: "", endereco: "" }; endereco.textContent = "CEP não encontrado. Confira os números."; return; }
      local = { cidade: `${j.localidade}/${j.uf}`, endereco: [j.logradouro, j.bairro, `${j.localidade}/${j.uf}`].filter(Boolean).join(", ") };
      endereco.textContent = local.endereco;
    } catch { local = { cidade: "", endereco: "" }; endereco.textContent = ""; }
  }
  cepIn.addEventListener("input", () => { cepIn.value = maskCep(cepIn.value); buscarCep(); });
  const form = h("form", { class: "stack", novalidate: true },
    h("label", { class: "f" }, "Nome completo", h("input", { id: "eNome", autocomplete: "name", placeholder: "Como está no seu documento", value: c.nome || "" })),
    h("label", { class: "f" }, "CPF", h("input", { id: "eCpf", inputmode: "numeric", placeholder: "000.000.000-00", value: maskCpf(c.cpf || ""), oninput: e => e.target.value = maskCpf(e.target.value) })),
    h("label", { class: "f" }, "WhatsApp com DDD", h("input", { id: "eWpp", inputmode: "tel", autocomplete: "tel", placeholder: "(67) 99999-9999", value: c.whatsapp || "", oninput: e => e.target.value = maskPhone(e.target.value) })),
    h("div", { class: "row" },
      h("label", { class: "f", style: "flex:2 1 160px" }, "CEP", cepIn),
      h("label", { class: "f", style: "flex:1 1 100px" }, "Número da casa", h("input", { id: "eNum", autocomplete: "address-line2", placeholder: "Ex.: 120", value: c.numeroCasa || "" }))),
    endereco,
    err, h("button", { class: "btn primary big", type: "submit", text: "Continuar" }));
  form.addEventListener("submit", e => {
    e.preventDefault();
    const d = { nome: $("eNome").value.trim().replace(/\s+/g, " "), cpf: dig($("eCpf").value), whatsapp: $("eWpp").value, cep: dig(cepIn.value), numeroCasa: $("eNum").value.trim(), cidade: local.cidade, endereco: local.endereco };
    const falha = d.nome.split(" ").length < 2 ? ["eNome", "Digite nome e sobrenome."]
      : !cpfValido(d.cpf) ? ["eCpf", "CPF inválido. Confira os números."]
      : dig(d.whatsapp).length < 10 ? ["eWpp", "Digite o WhatsApp com DDD."]
      : d.cep.length !== 8 ? ["eCep", "Digite o CEP com 8 números."]
      : !d.numeroCasa ? ["eNum", "Digite o número da casa (ou S/N)."] : null;
    if (falha) { err.textContent = falha[1]; $(falha[0]).focus(); return; }
    store.set("comprador", d);
    try { sessionStorage.removeItem("voltar"); } catch {}
    if (location.hash.slice(1) === (voltar || "")) route(); else location.hash = voltar || "";
  });
  setView(h("div", { style: "display:flex;flex-direction:column;gap:16px" },
    h("a", { href: "#", class: "meta", text: "← Ver todas as rifas" }),
    h("section", { class: "panel entrada", id: "dados" },
    h("div", {}, h("div", { class: "eyebrow", text: "Antes de escolher seus números" }), h("h1", { text: "Seus dados para participar" }),
      h("p", { class: "muted", style: "margin-top:6px", text: "Usamos esses dados para registrar seus bilhetes e entregar o prêmio se você ganhar. Eles não aparecem para outras pessoas." })),
    form)));
}

function setView(...nodes) { $("view").replaceChildren(...nodes); }

/* ---------------- vitrine ---------------- */
const pctTxt = p => {
  if (!(p > 0)) return "0%";
  if (p < 0.01) return "0,01%";
  const casas = p < 1 ? 2 : p < 10 ? 1 : 0;
  return (Math.floor(p * 10 ** casas) / 10 ** casas).toLocaleString("pt-BR", { maximumFractionDigits: casas }) + "%";
};
const diaMes = d => new Date(d).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
function faltam(d) {
  if (!d) return "";
  const ms = new Date(d) - Date.now(); if (ms <= 0) return "";
  const dias = Math.floor(ms / 864e5); if (dias >= 1) return dias === 1 ? "falta 1 dia" : `faltam ${dias} dias`;
  const hrs = Math.floor(ms / 36e5); return hrs >= 1 ? `faltam ${hrs} h` : "últimos minutos";
}
function cardRifa(r, aoClicar) {
  const pct = Math.min(100, r.pagos / r.total * 100);
  const nf = numFmt(r.inicio ?? 1, (r.inicio ?? 1) + r.total - 1);
  const quando = r.dataSorteio ? `Até ${diaMes(r.dataSorteio)}${faltam(r.dataSorteio) ? " · " + faltam(r.dataSorteio) : ""}` : "";
  const meta = [quando, r.extracao ? "Sorteio: " + r.extracao : ""].filter(Boolean).join(" · ");
  return h("a", { class: "card", href: "#rifa-" + r.id, onclick: aoClicar || null },
    h("div", { class: "img" }, r.imagem ? h("img", { src: r.imagem, alt: r.titulo, loading: "lazy" }) : h("span", { class: "ph", text: "Nº" }),
      r.numeroSorteado != null ? h("span", { class: "tag done", text: "Sorteada · nº " + nf(r.numeroSorteado) })
        : !r.vendasAbertas ? h("span", { class: "tag done", text: "Vendas encerradas" })
        : h("span", { class: "tag hot", text: "Vendendo" })),
    h("div", { class: "body" },
      h("h3", { text: r.titulo }),
      meta ? h("div", { class: "meta", text: meta }) : null,
      h("div", {}, h("div", { class: "bar" }, h("i", { class: "prog", style: `width:${Math.max(pct, pct > 0 ? 2 : 0)}%` })),
        h("div", { class: "meta", style: "margin-top:5px" }, h("b", { class: "grad-text", style: "font-size:1rem", text: pctTxt(pct) }), " vendido")),
      h("div", { class: "foot" }, h("span", { class: "price" }, brl(r.preco), h("small", { text: " por bilhete" })),
        h("span", { class: "btn primary sm", text: r.vendasAbertas ? "Comprar números" : "Ver resultado" }))));
}
async function preencherCards(cards, aoClicar) {
  try {
    const rifas = await api("rifas");
    cards.replaceChildren();
    if (!rifas.length) cards.append(h("div", { class: "empty", text: "Nenhuma rifa aberta no momento. Volte em breve." }));
    for (const r of rifas) cards.append(cardRifa(r, aoClicar ? e => aoClicar(e, r) : null));
  } catch (e) { cards.replaceChildren(h("div", { class: "empty", text: e.message })); }
}
async function viewHome() {
  const cards = h("section", { class: "cards duas", "aria-label": "Rifas" }, h("div", { class: "empty", text: "Carregando rifas…" }));
  setView(h("div", { style: "display:flex;flex-direction:column;gap:24px" },
    h("section", { class: "hero" }, h("div", { class: "eyebrow", text: "Rifas abertas" }),
      h("h1", {}, "Escolha o prêmio e ", h("span", { class: "grad-text", text: "garanta seus números" }))),
    cards));
  preencherCards(cards);

/* ---------------- rifa ---------------- */
async function viewRifa(id) {
  setView(h("div", { class: "empty", text: "Carregando rifa…" }));
  let R;
  try { R = await api("rifas/" + id); } catch (e) { return setView(h("div", { class: "empty" }, e.message + " ", h("a", { href: "#", text: "Ver todas as rifas" }))); }
  const S = { sel: new Set(), block: 0, page: 0, qty: 10, flash: null, pagos: new Set(), hold: new Set() };
  const setData = d => { R = d; S.pagos = new Set(d.pagosLista); S.hold = new Set(d.reservadosLista); for (const n of [...S.sel]) if (S.pagos.has(n) || S.hold.has(n)) S.sel.delete(n); };
  setData(R);
  const INI = R.inicio ?? 1, FIM = INI + R.total - 1, nf = numFmt(INI, FIM);
  const BLOCK = R.total > 10000 ? 10000 : 1000, blocks = Math.ceil(R.total / BLOCK);
  PAGE = R.total > 10000 ? 500 : 100;
  const blk = n => Math.floor((n - INI) / BLOCK);

  // bilhete
  const cd = h("div", { class: "cd" }, ["dias", "h", "min", "seg"].map(l => h("div", {}, h("b", { text: "--" }), h("span", { text: l }))));
  const tick = () => {
    const t = R.dataSorteio ? new Date(R.dataSorteio) - Date.now() : NaN, b = cd.querySelectorAll("b");
    if (!isFinite(t)) return;
    const s = Math.max(0, Math.floor(t / 1000));
    [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60].forEach((v, i) => b[i].textContent = String(v).padStart(2, "0"));
  };
  const ticket = h("section", { class: "ticket" },
    h("div", { class: "ticket-main" },
      h("div", { class: "prize-img" }, R.imagem ? h("img", { src: R.imagem, alt: "Foto do prêmio" }) : h("span", { class: "ph", text: "Nº" })),
      h("div", { style: "min-width:0" }, h("div", { class: "eyebrow", text: R.vendasAbertas ? `Rifa aberta · números de ${nf(INI)} a ${nf(FIM)}` : "Vendas encerradas" }),
        h("h1", { text: R.titulo }), R.descricao ? h("p", { class: "desc", text: R.descricao }) : null,
        h("div", { class: "priceline" }, h("span", { class: "eyebrow", text: "Cada bilhete" }), h("b", { text: brl(R.preco) })))),
    h("aside", { class: "stub" }, ...(R.dataSorteio ? [h("div", { class: "eyebrow", text: "Sorteio em" }), cd,
      h("div", { style: "font-size:.9rem", text: new Date(R.dataSorteio).toLocaleString("pt-BR", { weekday: "long", day: "2-digit", month: "long", hour: "2-digit", minute: "2-digit" }) })] : [h("div", { class: "eyebrow", text: "Sorteio" })]),
      R.extracao ? h("div", { style: R.dataSorteio ? "" : "font-family:var(--f-display);font-size:1.4rem;font-weight:800", class: R.dataSorteio ? "meta" : "", text: R.dataSorteio ? "Extração: " + R.extracao : R.extracao }) : null));
  tick(); timers.push(setInterval(tick, 1000));

  const winner = R.numeroSorteado != null ? h("section", { class: "winner" },
    h("div", {}, h("div", { class: "eyebrow", text: "Número sorteado" }), h("div", { class: "big", text: nf(R.numeroSorteado) })),
    h("div", {}, h("div", { class: "eyebrow", text: "Ganhador" }), h("div", { style: "font-family:var(--f-display);font-size:1.5rem;font-weight:800", text: R.ganhador?.nome || "—" }),
      h("div", { style: "opacity:.8", text: [R.ganhador?.cidade, R.sorteadoEm && new Date(R.sorteadoEm).toLocaleString("pt-BR")].filter(Boolean).join(" · ") }))) : null;

  // compra rápida (números aleatórios)
  const MIN = Math.max(1, R.minimo || 1); S.qty = Math.max(S.qty, MIN);
  const qtyIn = h("input", { id: "qty", type: "number", min: String(MIN), max: String(CFG.maxPorPedido), value: String(S.qty), inputmode: "numeric", "aria-label": "Quantidade de números" });
  const totalEl = h("b", {});
  const updQty = () => { S.qty = Math.max(MIN, Math.min(CFG.maxPorPedido, parseInt(qtyIn.value, 10) || MIN)); totalEl.textContent = brl(S.qty * R.preco); };
  qtyIn.addEventListener("input", () => { totalEl.textContent = brl(Math.max(MIN, parseInt(qtyIn.value, 10) || MIN) * R.preco); });
  qtyIn.addEventListener("change", () => { updQty(); qtyIn.value = S.qty; });
  const add = d => { qtyIn.value = Math.max(MIN, Math.min(CFG.maxPorPedido, (parseInt(qtyIn.value, 10) || 0) + d)); updQty(); };
  updQty();

  const c = document.getElementById("brilhos"); if (!c) return;
  const ctx = c.getContext("2d"), parado = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, pts = [];
  const cores = ["255,183,3", "255,77,109", "255,138,31", "193,59,245", "255,255,255"];
  function tam() {
    const d = Math.min(2, devicePixelRatio || 1); W = c.width = innerWidth * d; H = c.height = innerHeight * d;
    const n = Math.round(Math.min(70, innerWidth / 18));
    pts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.8 + .6) * d, f: Math.random() * 6.28, v: .6 + Math.random() * 1.4, dy: (.05 + Math.random() * .15) * d, cor: cores[Math.floor(Math.random() * cores.length)] }));
  }
  function estrela(p, a) {
    ctx.fillStyle = `rgba(${p.cor},${a})`; ctx.beginPath();
    const r = p.r * 2.6, k = p.r * .5;
    ctx.moveTo(p.x, p.y - r); ctx.lineTo(p.x + k, p.y - k); ctx.lineTo(p.x + r, p.y); ctx.lineTo(p.x + k, p.y + k);
    ctx.lineTo(p.x, p.y + r); ctx.lineTo(p.x - k, p.y + k); ctx.lineTo(p.x - r, p.y); ctx.lineTo(p.x - k, p.y - k); ctx.closePath(); ctx.fill();
  }
  function quadro(t) {
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      const a = parado ? .5 : (Math.sin(t / 1000 * p.v + p.f) + 1) / 2 * .8 + .1;
      if (!parado) { p.y -= p.dy; if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; } }
      estrela(p, a);
    }
    if (!parado && !document.hidden) requestAnimationFrame(quadro);
  }
  tam(); addEventListener("resize", tam);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !parado) requestAnimationFrame(quadro); });
  requestAnimationFrame(quadro);
})();
</script>
